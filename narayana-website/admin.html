<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Narayana Teerthar | Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --glass: backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(245, 158, 11, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(245, 158, 11, 0.05), transparent 25%);
    }

    /* LOGIN SCREEN */
    #login-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 3rem;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      transform: translateY(0);
      transition: all 0.3s ease;
    }
    .login-card h2 {
      margin-bottom: 2rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 1px;
    }
    .input-group {
      position: relative;
      margin-bottom: 1.5rem;
    }
    .input-group i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    .input-group input {
      width: 100%;
      padding: 1rem 1rem 1rem 3rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }
    .input-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
    }
    .btn {
      width: 100%;
      padding: 1rem;
      background: var(--accent);
      color: #1e1e1e;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(245, 158, 11, 0.3);
    }

    /* DASHBOARD */
    #dashboard-screen {
      display: none;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .topbar h1 {
      font-weight: 600;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .btn-logout {
      background: transparent;
      border: 1px solid var(--text-muted);
      color: var(--text-muted);
      padding: 0.5rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-logout:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 1rem 2rem;
      color: var(--text-muted);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    /* DATA TABLES */
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    th {
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }
    tr:hover td {
      background: rgba(255,255,255,0.02);
    }
    td.highlight { color: var(--accent); font-weight: 500; }
    
    .badge {
      padding: 0.35rem 0.75rem;
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent);
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-block;
    }
    
    .error-msg {
      color: #ef4444;
      margin-top: 1rem;
      font-size: 0.9rem;
      display: none;
    }

    /* LOADER */
    .loader {
      display: none;
      text-align: center;
      padding: 3rem;
      color: var(--accent);
      font-size: 2rem;
    }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <div class="login-card">
      <h2><i class="fas fa-lock"></i> Admin Access</h2>
      <form id="loginForm">
        <div class="input-group">
          <i class="fas fa-user"></i>
          <input type="text" id="username" placeholder="Username" required>
        </div>
        <div class="input-group">
          <i class="fas fa-key"></i>
          <input type="password" id="password" placeholder="Password" required>
        </div>
        <button type="submit" class="btn" id="loginBtn">Login</button>
        <div id="loginError" class="error-msg">Invalid credentials. Try again.</div>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard-screen">
    <div class="topbar">
      <h1><i class="fas fa-chart-pie"></i> Admin Dashboard</h1>
      <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
    
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('appointments')"><i class="fas fa-calendar-check"></i> Appointments</button>
      <button class="tab-btn" onclick="switchTab('contacts')"><i class="fas fa-envelope"></i> Contact Messages</button>
    </div>

    <div id="loader" class="loader"><i class="fas fa-spinner fa-spin"></i></div>

    <!-- Appointments Tab -->
    <div id="appointments" class="tab-content active">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Date Booked</th>
              <th>Name</th>
              <th>Phone</th>
              <th>Service</th>
              <th>Preferred Date/Time</th>
              <th>Message</th>
            </tr>
          </thead>
          <tbody id="appTbody"></tbody>
        </table>
      </div>
    </div>

    <!-- Contacts Tab -->
    <div id="contacts" class="tab-content">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Date Sent</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Message</th>
            </tr>
          </thead>
          <tbody id="conTbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const baseUrl = '/api';

    // Check if already logged in
    window.onload = () => {
      if(localStorage.getItem('adminToken')) {
        showDashboard();
      }
    }

    // Login Logic
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking...';
      btn.disabled = true;
      document.getElementById('loginError').style.display = 'none';

      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;

      try {
        const res = await fetch(`${baseUrl}/auth`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        
        if(res.ok && data.success) {
          localStorage.setItem('adminToken', data.token);
          showDashboard();
        } else {
          document.getElementById('loginError').style.display = 'block';
        }
      } catch (err) {
        document.getElementById('loginError').style.display = 'block';
        document.getElementById('loginError').innerText = 'Network error. Database might be down.';
      } finally {
        btn.innerHTML = 'Login';
        btn.disabled = false;
      }
    });

    function logout() {
      localStorage.removeItem('adminToken');
      document.getElementById('dashboard-screen').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
    }

    async function showDashboard() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard-screen').style.display = 'block';
      fetchData();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    async function fetchData() {
      const token = localStorage.getItem('adminToken');
      if(!token) return logout();

      document.getElementById('loader').style.display = 'block';
      
      try {
        // Fetch Appointments
        const appRes = await fetch(`${baseUrl}/appointments`, { headers: { 'Authorization': `Bearer ${token}` } });
        const appData = await appRes.json();
        if(!appRes.ok) throw new Error();
        
        const appTbody = document.getElementById('appTbody');
        appTbody.innerHTML = '';
        if(appData.data.length === 0) appTbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No appointments yet.</td></tr>';
        appData.data.forEach(a => {
          appTbody.innerHTML += `
            <tr>
              <td>${new Date(a.createdAt).toLocaleString()}</td>
              <td class="highlight">${a.name}</td>
              <td>${a.phone}</td>
              <td><span class="badge">${a.service}</span></td>
              <td>${new Date(a.date).toLocaleDateString()} at ${a.time}</td>
              <td>${a.message || '-'}</td>
            </tr>
          `;
        });

        // Fetch Contacts
        const conRes = await fetch(`${baseUrl}/contact`, { headers: { 'Authorization': `Bearer ${token}` } });
        const conData = await conRes.json();
        
        const conTbody = document.getElementById('conTbody');
        conTbody.innerHTML = '';
        if(conData.data.length === 0) conTbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No messages yet.</td></tr>';
        conData.data.forEach(c => {
          conTbody.innerHTML += `
            <tr>
              <td>${new Date(c.createdAt).toLocaleString()}</td>
              <td class="highlight">${c.name}</td>
              <td>${c.email}</td>
              <td>${c.phone}</td>
              <td>${c.message}</td>
            </tr>
          `;
        });

      } catch (err) {
        alert("Session expired or database error. Please login again.");
        logout();
      } finally {
        document.getElementById('loader').style.display = 'none';
      }
    }
  </script>
</body>
</html>
